<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Assistant</title>
  <meta name="description" content="A powerful AI chat assistant powered by n8n automation and OpenRouter LLM." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <img src="bot_avatar.jpg" alt="AI Logo" class="logo-img" />
        <span class="logo-text">NexusAI</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="Close sidebar" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Chat
    </button>

    <div class="history-section">
      <p class="history-label">Recent Chats</p>
      <ul class="history-list" id="historyList"></ul>
    </div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar">U</div>
        <div class="user-info">
          <span class="user-name">You</span>
          <span class="user-plan">Free Plan</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="topbar-toggle" id="topbarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title" id="topbarTitle">New Chat</span>
      <div class="topbar-actions">
        <button class="icon-btn" id="clearBtn" title="Clear conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <section class="chat-area" id="chatArea">
      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">
          <img src="bot_avatar.jpg" alt="NexusAI" class="welcome-logo-img" />
        </div>
        <h1 class="welcome-title">How can I help you today?</h1>
        <p class="welcome-subtitle">Powered by AI — ask me anything</p>
        <div class="suggestion-grid">
          <button class="suggestion-card" data-text="Explain quantum computing in simple terms">
            <span class="suggestion-icon">🔬</span>
            <span class="suggestion-text">Explain quantum computing in simple terms</span>
          </button>
          <button class="suggestion-card" data-text="Write a Python function to sort a list of dictionaries">
            <span class="suggestion-icon">💻</span>
            <span class="suggestion-text">Write a Python function to sort a list of dictionaries</span>
          </button>
          <button class="suggestion-card" data-text="Help me write a professional email">
            <span class="suggestion-icon">✉️</span>
            <span class="suggestion-text">Help me write a professional email</span>
          </button>
          <button class="suggestion-card" data-text="What are the best practices for personal finance?">
            <span class="suggestion-icon">💰</span>
            <span class="suggestion-text">Best practices for personal finance</span>
          </button>
        </div>
      </div>

      <!-- Messages Container -->
      <div class="messages-container" id="messagesContainer"></div>
    </section>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="input-wrapper">
        <div class="input-box" id="inputBox">
          <textarea
            id="userInput"
            placeholder="Message NexusAI..."
            rows="1"
            aria-label="Chat input"
          ></textarea>
          <div class="input-actions">
            <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="19" x2="12" y2="5"/>
                <polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <p class="disclaimer">NexusAI can make mistakes. Consider checking important information.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
